name: Backend CI

# backend/ 는 STack-Backend 와 같은 CI 를 돈다. 바뀐 파일에 필요한 작업만 고르고(changes), 문서만 바뀌면 건너뛴다.
#   build      코드·설정이 바뀌면 / schema 마이그레이션·db/tools 가 바뀌면(ERD 스냅샷은 경고만)
#   container  Dockerfile·compose·docker/·.env.example·gradle·src/main/resources 가 바뀌면
# 운영 배포는 STack-Corp/STack-Backend → yoobin-desktop-linux Jenkins → Hermes 가 맡는다(README "CI/CD").
on:
  push:
    branches: [main, dev]
    paths: ["backend/**"]
  pull_request:
    paths: ["backend/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

# action은 commit SHA로, container 이미지는 digest로 고정한다. 판은 줄 끝 주석에 적는다. 판을 올릴 때는 SHA와 주석을 함께 바꾼다.
jobs:
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
      schema: ${{ steps.diff.outputs.schema }}
      container: ${{ steps.diff.outputs.container }}
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "전체 실행"; { echo code=true; echo schema=true; echo container=true; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD -- backend/ | sed 's#^backend/##')
          printf '%s\n' "$files"
          pick() { printf '%s\n' "$files" | grep -qE "$1" && echo true || echo false; }
          code=$(printf '%s\n' "$files" | grep -vE '^$|^(docs|assets|db/erdcloud)/|\.md$' | grep -q . && echo true || echo false)
          # main 은 코드가 바뀌었으면 세 작업을 모두 돈다(자바 코드만 바뀌어도 실제 이미지 기동을 확인한다).
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$code" = true ]; then
            echo "main 코드 변경: 전체 실행"; { echo code=true; echo schema=true; echo container=true; } | tee -a "$GITHUB_OUTPUT"; exit 0
          fi
          {
            echo "code=$code"
            echo "schema=$(pick '^(src/main/resources/db/migration/|db/tools/)')"
            echo "container=$(pick '^(Dockerfile|\.dockerignore|compose\.yaml|\.env\.example|docker/|build\.gradle|settings\.gradle|gradle/|src/main/resources/)')"
          } | tee -a "$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # 영상 변환 테스트가 ffmpeg로 시험 영상을 만들고, 같은 process의 transcoder가 ffmpeg·ffprobe를 실행한다(ADR-0016).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      # 테스트가 Testcontainers로 MySQL 8.4를 띄우고 Flyway 마이그레이션을 적용한다.
      - name: Build
        run: ./gradlew build

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: backend/build/reports/tests/

  schema:
    name: Schema check and ERD snapshot
    needs: changes
    if: needs.changes.outputs.schema == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start MySQL 8.4
        run: |
          docker run -d --name astra-erd-mysql -e MYSQL_ROOT_PASSWORD=erd \
            mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
          # 초기화용 임시 서버가 아니라 3306에서 듣는 본 서버가 뜰 때까지 기다린다.
          for i in $(seq 1 90); do
            docker logs astra-erd-mysql 2>&1 | grep -q 'port: 3306' && exit 0
            sleep 2
          done
          docker logs astra-erd-mysql
          exit 1

      # backend/db/README.md 5절 3단계와 같은 절차다.
      - name: Apply migrations and run check.sql
        run: |
          docker cp src/main/resources/db/migration astra-erd-mysql:/tmp/migration
          docker cp db/tools/check.sql astra-erd-mysql:/tmp/check.sql
          out=$(docker exec astra-erd-mysql sh -c "mysql -uroot -perd -e 'CREATE DATABASE astra CHARACTER SET utf8mb4' \
            && for f in \$(ls /tmp/migration/V*__*.sql | sort -V); do mysql -uroot -perd --default-character-set=utf8mb4 astra < \$f || exit 1; done \
            && mysql -uroot -perd --default-character-set=utf8mb4 -N astra < /tmp/check.sql" 2>/dev/null)
          echo "$out"
          problems=$(echo "$out" | grep -vE '^(tables|fks)[[:space:]]' || true)
          if [ -n "$problems" ]; then
            echo "::error::check.sql reported problems (broken FK, missing COMMENT, or isolated table). See backend/db/README.md section 5."
            exit 1
          fi

      # 마이그레이션을 바꾸고 스냅샷을 다시 만들지 않았으면 알린다. 실패시키지는 않는다.
      - name: ERD snapshot is up to date
        run: |
          python3 db/tools/erdcloud_snapshot.py
          if ! git diff --quiet -- db/erdcloud/snapshot.json; then
            echo "::warning::backend/db/erdcloud/snapshot.json is stale. Run 'python db/tools/erdcloud_snapshot.py' in backend/ and commit the result."
          fi

  container:
    name: Container image and compose smoke test
    needs: changes
    if: needs.changes.outputs.container == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 배포 이미지를 만든다. registry에는 올리지 않는다. converter 역할은 LibreOffice를 더한 target converter다(ADR-0033).
      - name: Build images
        run: |
          docker build --tag astra-backend:ci .
          docker build --target converter --tag astra-backend-converter:ci .

      # 실제 비밀값 없이 띄운다. S3 주소는 기동에 쓰이지 않으므로 해석되지 않는 이름을 넣는다.
      - name: Write env file
        run: |
          {
            echo "COMPOSE_PROFILES=mysql"
            echo "ASTRA_IMAGE=astra-backend:ci"
            echo "ASTRA_CONVERTER_IMAGE=astra-backend-converter:ci"
            echo "DB_URL=jdbc:mysql://mysql:3306/astra"
            echo "DB_USERNAME=astra"
            echo "DB_PASSWORD=$(openssl rand -hex 16)"
            echo "ASTRA_STORAGE_ENDPOINT=http://storage.invalid:9000"
            echo "ASTRA_STORAGE_ACCESS_KEY=ci"
            echo "ASTRA_STORAGE_SECRET_KEY=ci"
            echo "ASTRA_STORAGE_PATH_STYLE=true"
            echo "ASTRA_SESSION_ALLOWED_ORIGINS=https://eclass.example.ac.kr"
            echo "ASTRA_DELIVERY_ORIGIN_ENABLED=true"
            echo "ASTRA_DELIVERY_ORIGIN_SIGNING_KEY='$(openssl rand -base64 32)'"
          } > .env

      # compose.yaml이 참조하는 변수가 모두 .env.example에 적혀 있는지, 구성이 schema에 맞는지 본다.
      - name: Check compose file and env example
        run: |
          missing=$(grep -oE '\$\{[A-Z_]+' compose.yaml | cut -c3- | sort -u | while read -r name; do
            grep -qE "^#? ?${name}=" .env.example || echo "${name}"
          done)
          if [ -n "$missing" ]; then
            echo "::error::.env.example does not list: $missing"
            exit 1
          fi
          docker compose config --quiet

      - name: Smoke test
        run: docker/smoke-test.sh

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes
