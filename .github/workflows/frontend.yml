name: Frontend CI

# frontend/ 는 PR·push 에서 꼭 필요한 것만: 타입 검사, 테스트(통과/실패), 프로덕션 빌드.
# 커버리지 임계값(95/90/95/95)과 변이 테스트(Stryker)는 수동 실행(workflow_dispatch)에서만 돈다. 문서만 바뀌면 건너뛴다.
on:
  push:
    branches: [main, dev]
    paths: ["frontend/**", "!frontend/**/*.md", "!frontend/docs/**", "!frontend/deploy/**"]
  pull_request:
    paths: ["frontend/**", "!frontend/**/*.md", "!frontend/docs/**", "!frontend/deploy/**"]
  workflow_dispatch:
    inputs:
      coverage:
        description: "커버리지 임계값 검사"
        type: boolean
        default: true
      mutation:
        description: "변이 테스트(Stryker, 10분 이상)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        if: github.event_name != 'workflow_dispatch' || !inputs.coverage
      - run: npm run test:coverage
        if: github.event_name == 'workflow_dispatch' && inputs.coverage
      - run: npx vite build
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.coverage
        with:
          name: coverage
          path: frontend/coverage/

  mutation:
    name: Mutation test
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: frontend/reports/mutation/
