name: test

# PR·main 에서는 꼭 필요한 것만: 타입 검사와 단위·통합 테스트(통과/실패).
# 커버리지 임계값과 변이 테스트는 오래 걸리거나 엄격해서 수동 실행(workflow_dispatch)에서만 돈다.
# 문서·배포 설정·handoff 만 바뀌면 돌지 않는다. 같은 PR 에 새 커밋이 오면 이전 실행을 끊는다.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**", "deploy/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**", "deploy/**", ".github/ISSUE_TEMPLATE/**"]
  workflow_dispatch:
    inputs:
      coverage:
        description: "커버리지 임계값 검사(vitest --coverage)"
        type: boolean
        default: true
      mutation:
        description: "변이 테스트(Stryker, 10분 이상)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
        if: github.event_name != 'workflow_dispatch' || !inputs.coverage
      - run: npm run test:coverage
        if: github.event_name == 'workflow_dispatch' && inputs.coverage
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch' && inputs.coverage
        with:
          name: coverage
          path: coverage/

  mutation:
    if: github.event_name == 'workflow_dispatch' && inputs.mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
