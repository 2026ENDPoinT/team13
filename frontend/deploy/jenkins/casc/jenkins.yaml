# Jenkins 설정 전체(JCasC). 컨테이너가 시작될 때마다 이 파일로 덮어쓴다. UI에서 바꾼 설정은 재시작하면 사라지므로 여기서 고친다.
# ${...} 값은 /run/secrets/<이름> 파일에서 읽는다(compose.yaml 의 secrets 마운트).
jenkins:
  systemMessage: "STack-Corp CI/CD (yoobin-desktop-linux). 설정은 Frontend-final/deploy/jenkins 에서 관리합니다."
  numExecutors: 3
  mode: NORMAL
  slaveAgentPort: -1
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          name: admin
          password: "${admin_password}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
  globalNodeProperties:
    - envVars:
        env:
          # 배포 대상. 이 키는 Hermes 에서 ~/bin/jenkins-deploy 만 실행할 수 있다(Frontend-final/deploy/hermes).
          - key: HERMES_SSH
            value: ubuntu@100.93.71.84
          - key: HERMES_KNOWN_HOSTS
            value: /usr/share/jenkins/casc/known_hosts
          # Testcontainers 처럼 빌드 컨테이너가 Docker 소켓을 쓸 때 --group-add 로 넘긴다(compose.yaml 에서 주입).
          - key: DOCKER_GID
            value: "${DOCKER_GID}"

unclassified:
  location:
    url: http://100.94.176.38:8090/
  timestamper:
    allPipelines: true

credentials:
  system:
    domainCredentials:
      - credentials:
          # fine-grained PAT: 소유자 STack-Corp, 아래 잡의 레포 3개만.
          # Contents·Metadata·Pull requests·Actions 읽기 + Commit statuses 쓰기(Actions 읽기는 STack-Backend 배포가 CI 결과를 기다리는 데 쓴다).
          - usernamePassword:
              scope: GLOBAL
              id: github-token
              description: GitHub fine-grained token (checkout, commit status, Actions 결과)
              username: yoobinkim541
              password: "${github_token}"
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: hermes-deploy
              description: Hermes 배포 키 (command= 로 jenkins-deploy 만 허용)
              username: ubuntu
              privateKeySource:
                directEntry:
                  privateKey: "${hermes_deploy_key}"

jobs:
  - script: |
      // 레포마다 multibranch 파이프라인 하나. 레포의 Jenkinsfile 을 쓴다.
      // 같은 조직 레포의 브랜치와 PR 만 빌드한다(포크 PR 은 이 PC 에서 코드를 실행하지 않도록 제외).
      // 2026-11-14: e-class 프론트엔드는 Frontend-final, 백엔드는 STack-Backend 로 바뀌었다.
      // STack-Frontend(현재 STack-Frontend-Keep-, 옛 ASTRA 보존 뷰어)는 보관용이라 잡을 두지 않는다.
      // STack-Backend 의 CI 는 GitHub Actions 가 돌리므로 main 만 보고 배포만 한다.
      def repos = [
        [name: 'Frontend-final',     prs: true,  branches: '*'],
        [name: 'STack-Backend',      prs: false, branches: 'main'],
        [name: 'STack-lessonviewer', prs: true,  branches: '*'],
      ]
      repos.each { r ->
        multibranchPipelineJob(r.name) {
          branchSources {
            branchSource {
              source {
                github {
                  id(r.name.toLowerCase())
                  repoOwner('STack-Corp')
                  repository(r.name)
                  repositoryUrl('https://github.com/STack-Corp/' + r.name)
                  configuredByUrl(false)
                  credentialsId('github-token')
                  traits {
                    gitHubBranchDiscovery { strategyId(1) }
                    if (r.prs) {
                      gitHubPullRequestDiscovery { strategyId(1) }
                    }
                    headWildcardFilter {
                      includes(r.branches)
                      excludes('')
                    }
                  }
                }
              }
            }
          }
          triggers { periodicFolderTrigger { interval('2m') } }
          orphanedItemStrategy {
            discardOldItems { numToKeep(10) }
          }
        }
      }
