# STack e-Class 프론트엔드 (STack-Corp/Frontend-final, 빌드한 dist/ 를 server.mjs 가 서빙).
# viewer 는 컨테이너 안 127.0.0.1:4190 에만 바인딩한다. tunnel 은 같은 네트워크 네임스페이스에서 붙고,
# 공개 호스트 eclass.stack-edu.com 은 Cloudflare Access(허용 이메일)로만 열린다.
# /api, /doc, /vod 는 같은 host 의 e-class 백엔드(~/projects/eclass-backend, compose 프로젝트 astra)의 api 로 넘긴다.
# 코드 갱신은 Jenkins(main 병합) → Hermes ~/bin/jenkins-deploy eclass-frontend 가 한다(deploy/jenkins/README.md).
services:
  viewer:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /app
    command: ['node', 'server.mjs', '--port', '4190']
    user: '1000:1000'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    environment:
      ASTRA_API_ORIGIN: http://api:8080
      # AI 도우미(홈 명령줄·마스코트 챗봇, POST /api/assistant)는 ASTRA_API_ORIGIN 이 있으면 다른 /api 처럼 백엔드로 넘어가고,
      # 백엔드의 ASTRA_LLM_*(같은 게이트웨이, loopback relay 경유)와 ASTRA_ASSISTANT_* 가 정한다(로그인·한도·감사 기록).
      # 아래 GEMINI_* 와 assistant.env 의 GEMINI_API_KEY 는 백엔드가 있는 동안 읽히지 않는다(백엔드 없는 샘플 모드의 로컬 중계용).
      # ASSISTANT_TIMEOUT_MS 는 백엔드의 ASTRA_ASSISTANT_TIMEOUT(기본 20초)으로 바뀌었다. 값·파일 정리는 host 운영자가 정한다.
      GEMINI_API_BASE: http://172.24.0.1:18090
      GEMINI_MODEL: gemini-4-hydrogen-low
      ASSISTANT_TIMEOUT_MS: '20000'
    env_file: [assistant.env]
    volumes:
      - ./Frontend-final:/app:ro
    networks: [default, astra_egress]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4190/']
      interval: 30s
      timeout: 5s
      retries: 3
      # 배포로 다시 만들 때 tunnel 이 빨리 붙도록 처음 60초는 2초마다 본다.
      start_period: 60s
      start_interval: 2s
    mem_limit: 384m
    cpus: 1.0
  tunnel:
    image: cloudflare/cloudflared:2026.11.0
    user: '0:0'
    restart: unless-stopped
    network_mode: 'service:viewer'
    depends_on:
      viewer:
        condition: service_healthy
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./cloudflared.yml:/etc/cloudflared/config.yml:ro
      - /home/ubuntu/.cloudflared/b6ca641a-bc0d-42ee-81ef-daddbcd9abf2.json:/run/secrets/tunnel.json:ro

networks:
  astra_egress:
    external: true
