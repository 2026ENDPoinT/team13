//중앙값 계산 함수
//크기 순으로 이미 정렬된 배열을 입력해야만 합니다
//범용성을 위해서 이 함수 자체에는 정렬 기능 미포함
function getMedian(array) {
  if (array.length == 0) return NaN; // 빈 배열은 에러 반환(NaN은 숫자가 아니라는 의미임)
  var center = parseInt(array.length / 2); // 요소 개수의 절반값 구하기
  if (array.length % 2 == 1) { // 요소 개수가 홀수면
    return array[center]; // 홀수 개수인 배열에서는 중간 요소를 그대로 반환
  } else {
    return (array[center - 1] + array[center]) / 2.0; // 짝수 개 요소는, 중간 두 수의 평균 반환
  }
}
function foo(arr) {
  var a = [], b = [], prev;
  arr.sort(function(a,b){
    return b - a;
  });
  for ( var i = 0; i < arr.length; i++ ) {
    if ( arr[i] !== prev ) {
      a.push(arr[i]);
      b.push(1);
    } else {
      b[b.length-1]++;
    }
    prev = arr[i];
  }
  return [a, b];
}
function Floor(n, pos) { 
  if (isNaN(n)) {
    return 0;
  }else{
    var digits = Math.pow(10, pos); 
    var num = Math.floor(n * digits) / digits; 
    return num.toFixed(pos);  
  }
}

 function deleteReport(){
   
   
   $.ajax({
     url: "/ilos/cls/st/report/report_submit_check.acl",
     type: "POST",
     data: {
       ud : "20269999",
       ky : "A202639999900004",
       returnData : "json",
       RT_SEQ : "1000011",
       SUBMIT_CHECK_DIV : "2",
       encoding : "utf-8"
           },
     async: false,
     success: function(data){
       if (data.isError) {
         alert(data.message);
         stRoomAuthCheck(data);         
       }else{
         if(confirm(data.confirmMsg)){
           $.ajax({
             url: "/ilos/cls/st/report/report_delete.acl",
             type: "POST",
             data: {
               ud : "20269999",
               ky : "A202639999900004",
               RT_SEQ : "1000011",
               CONTENT_SEQ : "1000012",
               returnData : "json",
               encoding : "utf-8"
                   },
             async: false,
             success: function(data){
                 if(data.isError) {
                   alert(data.message);
                   stRoomAuthCheck(data);
                 }else{
                   if(data.isKjkey){
                     viewActivityPage("/ilos/cls/st/report/report_view_form.acl", "report", "1000011");
                     setMenuSubmit("report", "1000011", false);
                  }else{
                    alert(data.chSubjtMessage);
                    document.location.href="/ilos/cls/st/submain/submain_form.acl";
                  }
                 }
               },
             error : ajaxErrorMsg
           });
           
         }
         
       }
     }
   });
   
   
 }
