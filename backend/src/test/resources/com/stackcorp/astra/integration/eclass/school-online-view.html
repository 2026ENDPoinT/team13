            });
            
          }
        });

          document.learningForm.submit();
        });
        
      }
    
  }
}

<script>
$(function() {
  $( "#dialog_secondary_auth" ).dialog({
    autoOpen: false,
    resize: "auto",
    show: "blind",
    hide: "fade", //explode"
    modal: true,
    closeOnClick: false,
    title: "The secondary self-certification",
    close: resetSecondaryAuthForm,
    width:550
  });
});

var secondaryAuthCallback;
var isSecondaryAuthLoading = false;
function toggleSecondaryAuthLoading(isLoading) {
  isSecondaryAuthLoading = isLoading;
  if (isSecondaryAuthLoading) {
    $('#secondary_auth_loading_wrap').show();
  } else {
    $('#secondary_auth_loading_wrap').hide();
  }
}
function getIsSecondaryAuthLoading() {
  return isSecondaryAuthLoading;
}

function checkSecondaryAuth(cb) {
  $.ajax({
    url: "/ilos/secondauth/session_secondary_auth_check.acl",
    type: "POST",
    data: {
      returnData : "json",
      AUTH_DIV : "1",
      encoding : "utf-8"
    },
    async: false,
    cache: false,
    success: function(data){
      var isReady = false;
      try {
        if (data) {
          if (data.isError) {
            if (data.messageCode == "E_CONFIRMED_SECONDARY_AUTH") {
              initSecondaryAuth(cb);
            } else {
//               alert(data.message);
              location.href = location.href; 
            }
          } else {
            isReady = true;
          }
        } else {
          throw "response is empty";
        }
      } catch (e) {
        isReady = true;
      }
      if (isReady) {
        cb();
      }
    },
    error : ajaxErrorMsg
  });
}

function initSecondaryAuth(callback) {
  resetSecondaryAuthForm();
  $('#dialog_secondary_auth').focus();
  toggleSecondaryAuthLoading(true);
  $.ajax({
    url: "/ilos/secondauth/secondary_auth_way_info.acl",
    type: "POST",
    data: {
      AUTH_DIV : 1,
      returnData : "json",
      encoding : "utf-8"
    },
    async: true,
    cache: false,
    success: function(data){
      try {
        if (data) {
          if (data.isError) {
            alert(data.message);
          } else {
            var is_enable_app = data.IS_ENABLE_APP;
            var is_enable_app2 = data.IS_ENABLE_APP2;
            var user_device_cnt = data.USER_DEVICE_CNT;
            user_device_cnt = user_device_cnt && user_device_cnt > 0 ? parseInt(user_device_cnt) : 0;
            
            var is_enable_email = data.IS_ENABLE_EMAIL;
            var is_enable_sms = data.IS_ENABLE_SMS;

            var user_name = data.USER_NAME;
            var is_enable_push = data.IS_ENABLE_PUSH;
            
//             alert(is_enable_app + " // " + is_enable_email + " // " + is_enable_sms);
            
            if (is_enable_app && is_enable_app == "Y") {
//               $('#secondary_auth_way_app').addClass("enable");
//               var _e_app = $('#secondary_auth_user_app');
//                     console.log(_e_app);
              if (user_device_cnt > 0) {
                var user_device_list = data.USER_DEVICE_LIST;
                if (user_device_list) {
                  if (user_device_list.length > 1) { // 여러개인 경우
                    for (var i = 0; i < user_device_list.length; i++) {
                      var _device = user_device_list[i];
//                       _e_app.append("<span>" + _device.DEVICE_MODEL + ", " + _device.OS_DIV + ", " + _device.LAST_DTM + "</span>");
                      appendSecondaryAuthSubList(1, _device.DEVICE_MODEL, _device.DEVICE_ID, _device.LAST_DTM);
                    }
                    appendSecondaryAuthList(1, ("Registered Device : " + user_device_cnt), "", true);
                  } else {
                    var _device = user_device_list[0];
                    appendSecondaryAuthList(1, _device.DEVICE_MODEL, _device.DEVICE_ID);
                  }
                }
              } else {
                //2차 본인인증 앱 인증 권고문구
                appendSecondaryAuthList(1, "Please authenticate your device in the ASTRA app.", "", false);

              }
            }
            
            if (is_enable_app2 && is_enable_app2 == "Y") {
              if (user_device_cnt > 0) {
                var user_device_list = data.USER_DEVICE_LIST;
                if (user_device_list) {
                  if (user_device_list.length > 1) { // 여러개인 경우
                    for (var i = 0; i < user_device_list.length; i++) {
                      var _device = user_device_list[i];
                      appendSecondaryAuthSubList2(5, _device.DEVICE_MODEL, _device.DEVICE_ID, _device.LAST_DTM);
                    }
                    appendSecondaryAuthList(5, ("Registered Device : " + user_device_cnt), "", true);
                  } else {
                    var _device = user_device_list[0];
                    appendSecondaryAuthList(5, _device.DEVICE_MODEL, _device.DEVICE_ID);
                  }
                }
              } else {
                //2차 본인인증 앱 인증 권고문구
                appendSecondaryAuthList(5, "Please authenticate your device in the ASTRA app.", "", false);

              }
            }
            
            if (is_enable_email && is_enable_email == "Y") {
//               $('#secondary_auth_way_email').addClass("enable");
//               var _e_email = $('#secondary_auth_user_email');
              var user_email = data.USER_EMAIL;
              if (user_email && user_email.length > 0) {
                appendSecondaryAuthList(2, user_email, user_email);
              } else {
                appendSecondaryAuthList(2, getUserInfoUpdateGuide("There is no email information. Please use it after registering."), "", false);
              }
//               _e_email.html(user_email);
            }
            if (is_enable_sms && is_enable_sms == "Y") {
//               $('#secondary_auth_way_sms').addClass("enable");
//               var _e_sms = $('#secondary_auth_user_sms');
              var user_phone = data.USER_PHONE;
              if (user_phone && user_phone.length > 0) {
                appendSecondaryAuthList(3, user_phone, user_phone);
              } else {
                appendSecondaryAuthList(3, getUserInfoUpdateGuide("There is no phone information. Please use it after registering."), "", false);
              }
//               _e_sms.html(user_phone);
            }
            if (is_enable_push && is_enable_push == "Y") {
//               $('#secondary_auth_way_sms').addClass("enable");
//               var _e_sms = $('#secondary_auth_user_sms');
              var user_id = data.USER_ID;
              var user_nm = data.USER_NAME;
              if (user_id && user_id.length > 0) {
                appendSecondaryAuthList(4, user_nm, user_id);
              } else {
                appendSecondaryAuthList(4, getUserInfoUpdateGuide("There is no user information."), "", false);
              }
//               _e_sms.html(user_phone);
            }
            
            secondaryAuthCallback = callback;
            showSecondaryAuthForm(1);
            $('#dialog_secondary_auth').dialog("open");
            $(window).focus();
          }
        } else {
          alert("Server network failed");
        }
      } catch (e) {
        alert("Error : " + e);
//         console.log(e);
      }
    },
    error : ajaxErrorMsg,
    complete : function() {
      toggleSecondaryAuthLoading(false);
    }
  });
}

function getUserInfoUpdateGuide(title) {
  var txt = "<div>" + title + "</div>";
  txt += "<div style=\"margin-top:10px; font-size:90%;\">";
    txt += "<div><span>Enrolled Student : </span><span style=\"display:inline-block; width:85%; word-break:keep-all; vertical-align:top;\">After changing your email information in the comprehensive information system, synchronize your personal information on this site's My Page.</span><div>";
    txt += "<div style=\"margin-top:2px;\"><span>Other Student : </span><span style=\"display:inline-block; width:85%; word-break:keep-all; vertical-align:top;\">Request modification from LMS administrator</span><div>";
  txt += "</div>"; 
  return txt;
}

function appendSecondaryAuthList(way, text, param, isParent) {
  var _e = $('#secondary_auth_way_wrap');
  if (!param) {
    param = '';
  }
  
  var itemTitle = "";
  if (way == 1) {
    itemTitle = "ASTRA App Push Authentication";
  } else if (way == 5) {
    itemTitle = "ASTRA App Authentication";
  } else if (way == 2) {
    itemTitle = "E-mail Authentication";
  } else if (way == 3) {
    itemTitle = "SMS Authentication";
  } else if (way == 4) {
    itemTitle = "PUSH Recognition";
  }

  if (_e) {
    var action = "startSecondaryAuth('" + text +  "', " + way + ", '" + param + "');";
//     var actionClass = "site-mouseover-border-color";
    var actionClass = "";
    if (isParent) {
      action = "showSecondaryAuthForm(2, " + way + ");";
    } else if(!param) {
      action = "";
      actionClass = "secondary_auth_way_disabled";      
    }
    
//     var item_html = "<a href=\"javascript:void(0);\" onclick=\"" + action + "\" way=\"" + way + "\" param=\"" + param + "\">" + text + "</a>";
    var item_html = "";
    item_html += "<button class=\"secondary_auth_way_item " + actionClass + "\" type=\"button\" onkeypress=\"this.onclick;\" onclick=\"" + action + "\">";
      item_html += "<div class=\"secondary_auth_way_item_inner\">";
        item_html += "<div class=\"secondary_auth_way_inner secondary_auth_way_inner_left\">";
          item_html += "<div class=\"font_body1\">" + itemTitle + "</div>";
          item_html += "<div class=\"font_body3\">" + text + "</div>";
        item_html += "</div>";
        item_html += "<div class=\"secondary_auth_way_inner secondary_auth_way_inner_right\">";
          item_html += "<img src=\"/ilos/images/secondauth/icon_right_arrow_gray_1x.png\" class=\"secondary_auth_way_next_btn\" width=\"15px\"/>";
        item_html += "</div>";
      item_html += "</div>";
    item_html += "</button>";
    
    _e.append(item_html);
  }
}

              currentTime = parseInt(currentTime);
            }
            var expireTime = data.EXPIRE_TIME;
            if (expireTime) {
              expireTime = parseInt(expireTime);
            }
            var sec = parseInt((expireTime - currentTime) / 1000); 
            if (way == 5) {
              startSecondaryAuthCountDown2(sec);

              var requestCode = data.REQUEST_CODE;

              $('#secondary_auth_confirm_input_request_code').html(requestCode);
              */
              $('#secondary_auth_confirm_input_auth_code_wrap').html(auth_code_input_html);
              $('#secondary_auth_confirm_view_wrap').hide();
              $('#secondary_auth_confirm_input_wrap').show();
            }

var saClientStartTime;
var saClientExpireTime;
function startSecondaryAuthCountDown(sec) {
  if (saDisplayInterval) {
    clearInterval(saDisplayInterval);
    saDisplayInterval = undefined;
  }
  if (sec > 0) {
    var maxSec = sec;
    var d = new Date();
    saClientStartTime = new Date().getTime();
    saClientExpireTime = saClientStartTime + (sec * 1000);
    var _e = $('#secondary_auth_remain_time');
    saDisplayInterval = setInterval(function() {
      var currTime = new Date().getTime();
      sec = parseInt((saClientExpireTime - currTime) / 1000);
      
      if (sec >= 0) {
        _e.text(getSADisplayTime(sec));
      } else {
        if (saDisplayInterval) {
          clearInterval(saDisplayInterval);
          saDisplayInterval = undefined;
        }
        alert("The authentication time has expired.");
        cancelSecondaryAuth();
      }
    }, 1000);
  } else {
    if (saDisplayInterval) {
      clearInterval(saDisplayInterval);
      saDisplayInterval = undefined;
    }
    alert("The authentication time has expired.");
    cancelSecondaryAuth();
  }
}
function startSecondaryAuthCountDown2(sec) {
  if (saDisplayInterval2) {
    clearInterval(saDisplayInterval2);
    saDisplayInterval2 = undefined;
  }
  if (sec > 0) {
    var maxSec = sec;
    var d = new Date();
    saClientStartTime = new Date().getTime();
    saClientExpireTime = saClientStartTime + (sec * 1000);
    var _e = $('#secondary_auth_confirm_view_remain_time');
    saDisplayInterval2 = setInterval(function() {
      var currTime = new Date().getTime();
      sec = parseInt((saClientExpireTime - currTime) / 1000);
      
      if (sec >= 0) {
        _e.text(getSADisplayTime(sec));
        if (sec % 5 == 0) { // 5초간격 폴링
          confirmSecondaryAuth(true);
        }
      } else {
        if (saDisplayInterval2) {
          clearInterval(saDisplayInterval2);
          saDisplayInterval2 = undefined;
        }
        alert("The authentication time has expired.");
        cancelSecondaryAuth();
      }
    }, 1000);
  } else {
    if (saDisplayInterval2) {
      clearInterval(saDisplayInterval2);
      saDisplayInterval2 = undefined;
    }
    alert("The authentication time has expired.");
    cancelSecondaryAuth();
  }
}
function getSADisplayTime(sec) {
  if (sec <= 0) {
    return "-:--";
  }
  var _min = parseInt(sec / 60);
  var _sec = parseInt(sec % 60);
  if (_sec < 10) {
    _sec = "0" + _sec;
  }
  var displayTime = _min + ":" + _sec;
  return displayTime;
}
function confirmSecondaryAuth(isBackground) {
  if (getIsSecondaryAuthLoading()) { // 통신중인경우 리턴
    return;

  var _e = $('#secondary_auth_input_code');

    toggleSecondaryAuthLoading(true);
    $('#secondary_auth_confirm_check_is_finish_alert').hide();
  }
  $.ajax({
    url: "/ilos/secondauth/secondary_auth_confirm.acl",
    type: "POST",
    data: {
      AUTH_SEQ : auth_seq,
      AUTH_DIV : 1,
      AUTH_WAY : auth_way,
      AUTH_CODE : auth_code,
      AUTH_PARAM : auth_param,
      returnData : "json",
      encoding : "utf-8"
    },
    async: true,
    cache: false,
    success: function(data){
      try {
        if (data) {
          if (data.isError) {
            if (!isBackground) {
              if (auth_way != 5) {
                alert(data.message);
              } else {
                if (data.messageCode == "E_CONFIRMED_SECONDARY_AUTH") {
                  $('#secondary_auth_confirm_check_is_finish_alert').show();
                } else {
                  alert(data.message);
                }
              }
            }
          } else {
//             alert(data.message);
            secondaryAuthCallback();
            closeSecondaryAuthForm();
          }
        } else {
          alert("Server network failed");
        }
      } catch (e) {
        alert("Error : " + e);
//         console.log(e);
      }
    },
    error : ajaxErrorMsg,
    complete : function() {
      if (!isBackground) {
        toggleSecondaryAuthLoading(false);
      }
    }
  });
}
