# 로컬 실행(TestStackBackendApplication) 전용 설정. 테스트 소스에 있어 배포하는 jar에는 들어가지 않는다.

# 이 컴퓨터에서만 접속한다.
server.address=127.0.0.1

# https가 없으므로 cookie의 Secure를 끈다.
astra.session.secure-cookie=false
astra.delivery.secure-cookie=false

# 프론트엔드 개발 서버(STack-eclass-Frontend, server.mjs)가 /api를 이 서버로 넘긴다. 그 origin만 허용한다.
astra.session.allowed-origins=http://127.0.0.1:4190,http://localhost:4190

# CloudFront가 없으므로 앱이 /doc, /vod를 직접 응답한다(ADR-0009). 서명 key는 LocalSeed가 실행할 때마다 만든다.
astra.delivery.origin.enabled=true

# 표본과 화면의 시각은 기관 시간대의 벽시계다(ADR-0039). 개발 PC의 시간대와 Testcontainers MySQL의 기본 시간대(UTC)는 쓰지 않는다.
# 앱이 DB 연결마다 session offset을 정하고 JVM 기본 시간대도 맞춘다. 기본값(Asia/Seoul)을 명시해 둔다.
astra.time.zone=Asia/Seoul
