spring.application.name=stack-backend

# DB 접속 정보는 환경 변수로만 받는다. 로컬에서 DB 없이 실행하려면 테스트 소스의 TestStackBackendApplication을 쓴다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 요청 본문에 문서에 없는 필드가 있으면 400으로 거부한다(SC-02: 요청의 사용자·역할 값을 받지 않는다).
spring.jackson.deserialization.fail-on-unknown-properties=true

# 업로드 상한. 파일 하나의 실제 상한은 upload_policies가 정하고, 이 값은 그보다 큰 요청을 본문을 읽기 전에 끊는다.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# 로그인은 session 쿠키로만 한다. Spring Boot가 기본 사용자와 비밀번호를 만들어 로그에 남기지 않게 한다.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
