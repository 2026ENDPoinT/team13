spring.application.name=stack-backend

# DB 접속 정보는 환경 변수로만 받는다. 로컬에서 DB 없이 실행하려면 테스트 소스의 TestStackBackendApplication을 쓴다.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 요청 본문에 문서에 없는 필드가 있으면 400으로 거부한다(SC-02: 요청의 사용자·역할 값을 받지 않는다).
spring.jackson.deserialization.fail-on-unknown-properties=true

# 업로드 상한. 파일 하나의 실제 상한은 upload_policies가 정하고, 이 값은 그보다 큰 요청을 본문을 읽기 전에 끊는다.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=51MB

# 로그인은 session 쿠키로만 한다. Spring Boot가 기본 사용자와 비밀번호를 만들어 로그에 남기지 않게 한다.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# 요청 로그의 모든 줄에 서버가 만든 requestId(MDC requestId)를 넣는다(SC-09, shared.RequestIdFilter).
logging.pattern.correlation=[%X{requestId:-}] 

# 운영 상태 확인은 health 하나만 켠다(ADR-0019). 관리 port는 API port와 따로 두고 container 안의 127.0.0.1에만 연다.
# CloudFront와 compose가 publish하는 port로는 닿지 않는다(architecture.md 3.3절). 응답에는 상태(UP/DOWN)만 있다.
# readiness는 DB까지 확인하고, liveness는 process 상태만 본다. compose healthcheck는 readiness를 부른다.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.group.readiness.include=readinessState,db

# 로그는 stdout에 한 줄씩 JSON(ECS)으로 쓴다. MDC의 requestId가 줄마다 들어간다(architecture.md 9절).
logging.structured.format.console=ecs

# 종료 신호를 받으면 새 요청을 받지 않고, 처리 중인 요청과 작업을 단계마다 30초까지 기다린 뒤 닫는다.
# compose의 stop_grace_period는 이보다 길게 둔다.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# 서버 1대 기준 상한. DB 연결을 5초 안에 얻지 못하면 요청을 실패로 끝낸다. worker는 compose에서 연결 수를 줄인다.
server.tomcat.threads.max=64
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=5000
