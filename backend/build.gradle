plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.stackcorp'
version = '0.0.1-SNAPSHOT'
description = 'ASTRA backend'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom 'org.springframework.modulith:spring-modulith-bom:2.1.2'
		mavenBom 'software.amazon.awssdk:bom:2.57.13'
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	// 운영 상태 확인(health)만 쓴다. 관리 port와 노출 범위는 application.properties에 있다(ADR-0019).
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// 지표와 trace를 OTLP로 내보낸다. 기본은 꺼져 있고 ASTRA_OTLP_ENABLED와 주소를 줄 때만 보낸다(ADR-0034).
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation('software.amazon.awssdk:s3') {
		// 동기 client만 쓴다. Netty는 Spring Boot가 관리하는 판과 섞이지 않게 뺀다.
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation('software.amazon.awssdk:cloudfront') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	// 문서 변환 process(com.stackcorp.converter)만 쓴다.
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	// 학교 e-Class 로그인 화면을 읽는다(integration.eclass).
	implementation 'org.jsoup:jsoup:1.21.2'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	// 내보내기 bean이 기본 설정에서 생기지 않는지 확인하는 테스트가 type으로 찾는다(ObservabilityExportTests).
	testImplementation 'io.micrometer:micrometer-registry-otlp'
	testImplementation 'io.opentelemetry:opentelemetry-exporter-otlp'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// 기본값(512 MiB)으로는 모자란다. 캐시된 Spring context와 ArchUnit 모델이 full GC 뒤에도 약 420 MB를 쥐고 있고, converter 테스트가
	// 같은 JVM에서 96 MB 사진(6000×4000 int RGB)을 만들 때 dev에서도 여유가 약 16 MB뿐이었다.
	maxHeapSize = '1g'
}

// 로컬 실행(bootTestRun)의 main을 고정한다. 테스트 소스에는 main을 가진 보조 class(FakeSoffice 등)도 있어
// Spring Boot가 하나를 고르지 못한다.
tasks.named('bootTestRun') {
	mainClass = 'com.stackcorp.astra.TestStackBackendApplication'
}
