# ASTRA 백엔드를 host 한 대에서 실행하는 구성(architecture.md 3.1절과 4.3절, ADR-0003, ADR-0019).
# 이미지: docker build -t astra-backend:local .   (다른 이미지는 ASTRA_IMAGE로 지정한다)
# 설정: .env.example을 .env로 복사해 값을 채운다. .env는 커밋하지 않는다.
# 실행: docker compose up -d --wait
#
# network 경계
#   egress      외부로 나가는 network. api와 worker만 붙는다. api의 port는 여기서 publish한다.
#               bridge 이름을 astra-egress로 고정한다. EC2 host의 firewall은 container에서 instance metadata(IAM role
#               credential)로 가는 트래픽 중 이 bridge에서 온 것만 통과시킨다(ADR-0020 6번)
#   signatures  외부로 나가는 network. freshclam 하나만 붙는다. instance metadata에는 닿지 않는다
#   data        외부로 나갈 수 없는 내부 network. api, worker, mysql
#   conversion  외부로 나갈 수 없는 내부 network. worker와 converter만 붙는다. converter는 이 network 하나에만 있다
#   transcoding 외부로 나갈 수 없는 내부 network. worker와 transcoder만 붙는다. transcoder는 이 network 하나에만 있다
#   scanning    외부로 나갈 수 없는 내부 network. worker와 clamav만 붙는다. clamav는 이 network 하나에만 있다
# publish하는 port는 api의 8080 하나다. 기본은 127.0.0.1에만 묶는다. MySQL, converter, transcoder, clamav, 관리 port(8081)는
# publish하지 않는다.

name: astra

# process 수 상한은 서비스마다 deploy.resources.limits.pids에 적는다. pids_limit을 함께 쓰면 compose가
# 두 값이 다르다고 구성을 거부한다(deploy.resources.limits가 있고 pids가 없을 때도 그렇다).
x-app: &app
  image: ${ASTRA_IMAGE:-astra-backend:local}
  read_only: true
  tmpfs:
    - /tmp:size=256m,mode=1777
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

x-app-health: &app-health
  # 관리 port는 container 안의 127.0.0.1에만 열린다. readiness는 DB 연결까지 본다.
  test: ["CMD", "astra-health", "8081", "/actuator/health/readiness"]
  interval: 10s
  timeout: 5s
  retries: 3
  start_period: 120s

services:
  api:
    <<: *app
    command: [api]
    # api와 worker는 같은 신뢰 경계(같은 host, 같은 instance role)에 있어 같은 env file을 받는다. converter는 받지 않는다.
    env_file: .env
    environment:
      # 브라우저는 api에 직접 오지 않는다. 앞단(CloudFront, 또는 /api·/doc·/vod를 넘기는 프론트엔드 서버 Frontend-final server.mjs)이
      # Host를 바꾸거나 https를 http로 넘기므로 앱은 요청에서 브라우저의 origin을 알 수 없다. 허용 Origin을 비워 두면 GET은 되고
      # POST·PUT·DELETE만 모두 403이 되므로, 값이 없으면 compose가 구성을 거부한다(ADR-0004 4번).
      ASTRA_SESSION_ALLOWED_ORIGINS: "${ASTRA_SESSION_ALLOWED_ORIGINS:?set ASTRA_SESSION_ALLOWED_ORIGINS in .env to the public frontend origin, e.g. https://eclass.stack-edu.com}"
      # /doc, /vod cookie 서명(CloudFront 또는 앱 직접 응답)이 없으면 시작하지 않는다(ADR-0009). 없으면 쪽 이미지와 영상이 열리지 않는다.
      ASTRA_DELIVERY_REQUIRED: "true"
    networks: [egress, data]
    ports:
      - "${ASTRA_API_BIND:-127.0.0.1}:${ASTRA_API_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
        # RDS를 쓰면 mysql 프로필을 끄고 DB_URL을 RDS로 바꾼다.
        required: false
    healthcheck: *app-health
    # Spring의 종료 단계(단계마다 최대 30초)가 끝날 때까지 기다린 뒤 강제 종료한다.
    stop_grace_period: 75s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1280m
          pids: 512

  worker:
    <<: *app
    command: [worker]
    env_file: .env
    environment:
      ASTRA_CONVERTER_URL: http://converter:8090
      ASTRA_TRANSCODER_URL: http://transcoder:8091
    networks: [egress, data, conversion, transcoding, scanning]
    depends_on:
      mysql:
        condition: service_healthy
        required: false
      # Flyway 마이그레이션은 api가 먼저 적용한다.
      api:
        condition: service_healthy
      converter:
        condition: service_healthy
      transcoder:
        condition: service_healthy
      # 업로드 검사는 worker만 clamd를 부른다. scan 프로필을 켰을 때만 기다린다. 서명을 받기 전에는 worker가 뜨지 않으므로
      # 그동안 api가 받은 업로드는 quarantined로 남는다(ADR-0018 4번).
      clamav:
        condition: service_healthy
        required: false
    healthcheck: *app-health
    stop_grace_period: 75s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024m
          pids: 512

  # 격리한 문서 변환 process(SC-08, ADR-0006). 외부 network, 비밀값, 저장소 credential이 없고 worker만 부를 수 있다.
  # env_file을 주지 않는다.
  # 이미지는 LibreOffice를 더한 target converter다(ADR-0033). office 문서를 PDF로 바꾸는 soffice를 이 container 안에서만 실행한다.
  converter:
    <<: *app
    image: ${ASTRA_CONVERTER_IMAGE:-astra-backend-converter:local}
    command: [converter]
    # soffice가 남긴 손자 process를 거둔다. converter의 java가 PID 1이면 강제로 끝낸 process가 zombie로 남는다.
    init: true
    # LibreOffice의 작업 디렉터리(입력, profile, 결과 PDF)는 작업마다 /tmp에 만들고 지운다.
    tmpfs:
      - /tmp:size=768m,mode=1777
    environment:
      CONVERTER_PORT: "8090"
      CONVERTER_OFFICE_TIMEOUT_SECONDS: "120"
      # container 메모리의 나머지는 soffice가 쓴다. soffice의 주소 공간 상한은 CONVERTER_OFFICE_MEMORY_BYTES(기본 3 GiB)다.
      JAVA_OPTS: "-XX:MaxRAMPercentage=30"
    networks: [conversion]
    healthcheck:
      test: ["CMD", "astra-health", "8090", "/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2048m
          pids: 512

  # 격리한 영상 변환 process(SC-08, ADR-0016). converter와 같이 외부 network, 비밀값, 저장소 credential이 없고 worker만 부를 수
  # 있다. 원본과 결과는 /work volume에 요청마다 만들고 응답 뒤 지운다. 암호화 key는 이 container에 오지 않는다.
  # 원본 2 GiB와 결과 4 GiB를 담을 수 있도록 /work의 디스크 여유를 둔다. ffmpeg thread 수는 cpus 상한에 맞춘다.
  transcoder:
    <<: *app
    command: [transcoder]
    environment:
      TRANSCODER_PORT: "8091"
      TRANSCODER_WORK_DIR: /work
      TRANSCODER_THREADS: "2"
      TRANSCODER_MAX_BYTES: "2147483648"
      TRANSCODER_MAX_OUTPUT_BYTES: "4294967296"
      TRANSCODER_TIMEOUT_SECONDS: "7200"
      TRANSCODER_MAX_DURATION_SECONDS: "14400"
    volumes:
      - transcoder-work:/work
    networks: [transcoding]
    healthcheck:
      test: ["CMD", "astra-health", "8091", "/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048m
          pids: 256

  # 같은 host의 MySQL. COMPOSE_PROFILES에 mysql이 있을 때만 뜬다. host에 port를 publish하지 않는다.
  # root는 container 안에서만 접속할 수 있고 비밀번호는 처음 초기화할 때 임의로 만든다. 앱은 DB_USERNAME 계정만 쓴다.
  mysql:
    image: mysql:8.4.13@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    profiles: [mysql]
    environment:
      MYSQL_DATABASE: astra
      MYSQL_USER: ${DB_USERNAME:?DB_USERNAME must be set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_ROOT_HOST: localhost
      # 서버 기본 시간대. 앱은 연결마다 session 시간대를 기관 offset으로 정하므로 이 값에 기대지 않는다(ADR-0039). 운영자가 mysql
      # client로 본 NOW()가 저장된 일시와 같은 벽시계가 되도록 맞춘다.
      TZ: ${ASTRA_TIME_ZONE:-Asia/Seoul}
    volumes:
      - mysql-data:/var/lib/mysql
    networks: [data]
    healthcheck:
      # 초기화 중의 임시 서버는 TCP를 열지 않으므로 127.0.0.1로 확인한다.
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: unless-stopped
    stop_grace_period: 60s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  # 업로드 악성코드 검사기(ClamAV). COMPOSE_PROFILES에 scan이 있을 때만 뜬다.
  # 검사하는 clamd(clamav)와 서명을 받는 freshclam을 나누고, 둘은 서명 volume 하나만 함께 쓴다(ADR-0018, ADR-0019 4번).
  # 신뢰할 수 없는 파일을 읽는 clamd는 worker와만 공유하는 내부 network에 있어 외부, instance metadata, MySQL, api에 닿지 않는다.
  # freshclam은 외부로 나가지만 자기 network에 혼자 있어 업로드 파일을 받지 않고 다른 container에도 닿지 않는다.
  # 앱은 ASTRA_SCAN_CLAMD_HOST=clamav, ASTRA_SCAN_CLAMD_PORT=3310으로 부른다.
  # 이미지는 서명이 들어 있지 않은 _base 판이다. 서명은 freshclam이 volume에 받은 것만 쓴다. 서명이 든 판은 volume을 처음 만들 때
  # 이미지를 만든 날의 서명을 복사해 넣으므로, freshclam이 갱신하기 전에 오래된 서명으로 검사할 수 있다.
  # Debian 판은 amd64와 arm64 이미지가 있다. Alpine 판은 amd64뿐이다.
  clamav:
    image: clamav/clamav:1.4.6_base-debian@sha256:b3d417fcc0de969b2aef169ac391326f2cdf27cc42991e9100fe477838b466ce
    profiles: [scan]
    # 이미지 entrypoint의 첫 서명 내려받기를 건너뛰고 clamd만 띄운다. 서명은 freshclam이 받은 volume을 읽고,
    # 서명 파일이 바뀌면 clamd가 스스로 다시 읽는다(SelfCheck). 크기 상한은 clamd 기본값(stream 100M)이 업로드 상한(50 MB)보다 크다.
    command: ["clamd", "--foreground"]
    environment:
      # 서명을 다시 읽을 때 새 engine을 옛 engine 옆에 만들지 않는다. 그러면 하루 몇 번 메모리가 두 배(약 2.4 GiB)로 뛰지 않고,
      # 다시 읽는 수십 초 동안 검사가 기다린다. 기다리다 제한 시간을 넘으면 worker가 quarantined로 두고 다시 시도한다.
      CLAMD_CONF_ConcurrentDatabaseReload: "no"
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [scanning]
    depends_on:
      freshclam:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 3g

  freshclam:
    image: clamav/clamav:1.4.6_base-debian@sha256:b3d417fcc0de969b2aef169ac391326f2cdf27cc42991e9100fe477838b466ce
    profiles: [scan]
    environment:
      CLAMAV_NO_CLAMD: "true"
      # 하루 12번(2시간마다) 갱신을 확인한다. 이미지 entrypoint의 기본값은 하루 1번이다.
      FRESHCLAM_CHECKS: "12"
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [signatures]
    healthcheck:
      # 세 서명(main, daily, bytecode)을 모두 받았는지 본다. 빈 volume에서는 처음 내려받는 데 몇 분이 걸린다.
      test:
        - CMD-SHELL
        - for d in main daily bytecode; do ls /var/lib/clamav/$$d.cvd /var/lib/clamav/$$d.cld 2>/dev/null | grep -q . || exit 1; done
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s
    restart: unless-stopped
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          # 받은 서명을 시험으로 읽어 보는(TestDatabases) 동안 수백 MB를 쓴다.
          memory: 1g

networks:
  egress:
    driver_opts:
      # host firewall이 이 이름으로 instance metadata 허용 여부를 가린다(infra/terraform/modules/app/templates/app-user-data.sh).
      com.docker.network.bridge.name: astra-egress
  signatures: {}
  data:
    internal: true
  conversion:
    internal: true
  transcoding:
    internal: true
  scanning:
    internal: true

volumes:
  mysql-data: {}
  clamav-db: {}
  transcoder-work: {}
